<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · LinkTalogo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--tinta:#1b1446;--violeta:#5b3df5;--papel:#fbfaff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--papel);color:var(--tinta);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
    main{max-width:460px;display:grid;gap:16px;justify-items:center}
    .logo{width:72px;height:72px}
    h1{margin:0;font-size:clamp(1.8rem,1.2rem + 3vw,2.6rem);line-height:1.1}
    p{margin:0;color:#4a4470;font-size:1.05rem}
    .botones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
    a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;text-decoration:none}
    .uno{background:var(--violeta);color:#fff}
    .dos{border:2px solid var(--tinta);color:var(--tinta)}
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#5b3df5"/><g transform="translate(5.5 5.5) scale(.875)" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g></svg>
    <h1>Esta página no existe</h1>
    <p>Puede que el link esté incompleto o que la tienda haya cambiado de dirección. Revisa que esté bien escrito.</p>
    <div class="botones">
      <a class="btn uno" href="/">Ir a LinkTalogo</a>
      <a class="btn dos" href="/lookshop">Ver una tienda de ejemplo</a>
    </div>
  </main>
</body>
</html>
