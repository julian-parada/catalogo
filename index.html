<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | 324 734 8475</title>
  <meta name="description" content="Catálogo de gorras. Selecciona tus modelos y haz tu pedido por WhatsApp.">
  <link rel="stylesheet" href="style.css">
  
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseConfig.js"></script>
<script src="tema.js"></script>

</head>

<body>
  
  <div class="topbar">
  <div class="topbar-inner">
    <a class="brand-unificado" id="topbarBrand"></a>

    <nav class="cat-nav" id="catNav" aria-label="Categorías">
      <div class="cat-dropdown" id="catDropdown" hidden>
        <button type="button" class="cat-link cat-trigger" id="catTrigger" aria-haspopup="true" aria-expanded="false">
          <span id="catTriggerLabel">Categorías</span>
          <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="cat-menu" id="catMenu" hidden></div>
      </div>

      <button type="button" class="cat-link cat-nuevo" id="btnNuevos" data-cat="__nuevos__" hidden>Productos Nuevos</button>
      <button type="button" class="cat-link cat-promo" id="btnPromos" data-cat="__promos__" hidden>Promociones</button>
    </nav>

    <input id="searchInput" type="search" placeholder="Buscar">
  </div>
</div>

  <header class="hero">
    <div class="hero-overlay">
      <span data-cfg="portada_frase" class="tag">STREETWEAR • CALIDAD • ACTITUD</span>
      <a class="brand-unificado" id="adminBrand"></a>
      <p data-cfg="portada_subtitulo"></p>
      <a href="#catalogo" class="btn btn-primary" data-cfg="portada_boton"></a>
    </div>
  </header>

  <main>
    <section class="section" id="catalogo">
      <div class="section-title">
        <div>
          <span class="eyebrow" data-cfg="catalogo_etiqueta"></span>
          <h2 data-cfg="catalogo_titulo"></h2>
        </div>
        <button class="cart-button" id="openCart"> Pedido <span id="cartCount">0</span></button>
      </div>



      

      <div class="products" id="products"></div>
    </section>

    
  </main>
  <div class="modal" id="cartModal" aria-hidden="true">
    <div class="modal-card">
      <button class="close" id="closeCart">×</button>
      <span class="eyebrow">TU PEDIDO</span>
      <h2>Prendas seleccionadas</h2>
      <div id="cartItems"></div>
      <div class="cart-total">
        <span>Total estimado</span>
        <strong id="cartTotal">$0</strong>
      </div>
      <button class="btn btn-whatsapp" id="sendWhatsapp">ENVIAR PEDIDO POR WHATSAPP</button>
      <p class="note">Se abrirá WhatsApp con el listado de productos seleccionados.</p>
    </div>
  </div>
  <div class="modal" id="imgModal">
  <div class="img-modal-content">
    <img id="imgBig" src="" alt="">
    <div id="imgThumbs" class="img-thumbs"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<footer class="footer" id="footer">
  <div class="footer-inner">
    <div class="footer-col">
      <a href="index.html" class="footer-name" id="footerBrand"></a>
      <p class="footer-text" id="footerTexto"></p>
      <div class="footer-social" id="footerSocial"></div>
    </div>

    <div class="footer-col">
      <h4>Contacto</h4>
      <ul class="footer-list" id="footerContacto"></ul>
    </div>

    <div class="footer-col">
      <h4>Explora</h4>
      <ul class="footer-list" id="footerCats"></ul>
    </div>
  </div>

  <div class="footer-bottom" id="footerCopy"></div>
</footer>


  <script src="tienda.js"></script>
<script src="script.js"></script>
  
</body>

</html>
