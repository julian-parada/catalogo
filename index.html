<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo en línea</title>
  <meta name="description" content="Mira el catálogo, elige tus productos y haz tu pedido por WhatsApp.">
  <meta property="og:title" content="Catálogo en línea">
  <meta property="og:description" content="Mira el catálogo, elige tus productos y haz tu pedido por WhatsApp.">
  <meta property="og:type" content="website">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- 1. ESTA ES LA LIBRERÍA DE SUPABASE (La que faltaba) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Tu configuración (donde están tu URL y Key) -->
  <script src="supabaseConfig.js"></script>
  
  <!-- 3. Tus otros scripts -->
  <script src="utils.js"></script> 
  <script src="tema.js"></script>
</head>
<body>
  
  <div class="topbar">
  <div class="topbar-inner">
    <a class="brand-unificado" id="topbarBrand"></a>




<nav class="cat-nav" id="catNav" aria-label="Categorías">
  <div class="cat-dropdown" id="catDropdown" hidden>
        <button type="button" class="cat-link cat-trigger" id="catTrigger" aria-haspopup="true" aria-expanded="false">
          <span id="catTriggerLabel">Categorías</span>
          <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div  class="cat-menu" id="catMenu" hidden></div>
      </div>
  <button type="button" class="cat-link cat-nuevo" id="btnNuevos" data-cat="__nuevos__" hidden>Productos Nuevos</button>
  <button type="button" class="cat-link cat-promo" id="btnPromos" data-cat="__promos__" hidden>Promociones</button>
</nav>

<input id="searchInput" type="search" placeholder="Buscar">   <!-- 👈 ahora es hermano del nav -->

<button class="cart-button" id="openCart" aria-label="Ver pedido">
   <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-cart4" viewBox="0 0 16 16"><path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l.5 2H5V5zM6 5v2h2V5zm3 0v2h2V5zm3 0v2h1.36l.5-2zm1.11 3H12v2h.61zM11 8H9v2h2zM8 8H6v2h2zM5 8H3.89l.5 2H5zm0 5a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"/></svg>
  <span class="cart-text"></span>
  <span id="cartCount">0</span>
</button>




  </div>
</div>

  <header class="hero">
    <div class="hero-overlay">
      <span data-cfg="portada_frase" class="tag"></span>
      <p data-cfg="portada_subtitulo"></p>
      <a href="#catalogo" class="btn btn-primary hero-cta">
  <span class="cta-text" data-cfg="portada_boton"></span>
  <span class="cta-arrow" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </span>
</a>
    </div>
  </header>

  <main>
    <section class="section" id="catalogo">
      <div class="section-title">
        <div>
          <span class="eyebrow" data-cfg="catalogo_etiqueta"></span>
          <h2 data-cfg="catalogo_titulo"></h2>
        </div>
        
      </div>

      <div class="products" id="products"></div>
    </section>

    
  </main>
  <div class="modal" id="cartModal" aria-hidden="true">
    <div class="modal-card">
      <button class="close" id="closeCart">×</button>
      <span class="eyebrow">TU PEDIDO</span>
      <h2>Productos seleccionados</h2>
      <div id="cartItems"></div>
      <div class="cart-total">
        <span>Total estimado</span>
        <strong id="cartTotal">$0</strong>
      </div>

      <!-- Datos del comprador: se recuerdan en este navegador para la próxima compra -->
      <form id="datosCliente" class="datos-cliente" novalidate>
        <h3>Tus datos</h3>

        <label class="dc-campo">
          <span>Nombre</span>
          <input id="dcNombre" type="text" maxlength="80" autocomplete="name" placeholder="¿A nombre de quién va el pedido?">
        </label>

        <fieldset class="dc-grupo">
          <legend>¿Cómo lo recibes?</legend>
          <div class="dc-opciones">
            <label class="dc-opcion"><input type="radio" name="dcEntrega" value="domicilio"><span>🛵 Domicilio</span></label>
            <label class="dc-opcion"><input type="radio" name="dcEntrega" value="recoger"><span>🏪 Recoger en tienda</span></label>
          </div>
        </fieldset>

        <div id="dcDomicilio" class="dc-domicilio" hidden>
          <label class="dc-campo">
            <span>Dirección</span>
            <input id="dcDireccion" type="text" maxlength="150" autocomplete="street-address" placeholder="Ej: Cra 12 #8-45">
          </label>
          <label class="dc-campo">
            <span>Barrio</span>
            <input id="dcBarrio" type="text" maxlength="80" placeholder="Ej: Santa Clara">
          </label>
          <label class="dc-campo">
            <span>Punto de referencia <small>(opcional)</small></span>
            <input id="dcReferencia" type="text" maxlength="150" placeholder="Ej: frente a la panadería">
          </label>
        </div>
        <p id="dcRecoger" class="dc-info" hidden></p>

        <fieldset class="dc-grupo">
          <legend>Forma de pago</legend>
          <div class="dc-opciones">
            <label class="dc-opcion"><input type="radio" name="dcPago" value="efectivo"><span>💵 Efectivo</span></label>
            <label class="dc-opcion"><input type="radio" name="dcPago" value="nequi"><span>📱 Nequi</span></label>
            <label class="dc-opcion"><input type="radio" name="dcPago" value="transferencia"><span>🏦 Transferencia</span></label>
          </div>
        </fieldset>

        <label class="dc-campo">
          <span>Nota para la tienda <small>(opcional)</small></span>
          <textarea id="dcNota" maxlength="300" rows="2" placeholder="Algo que quieras que la tienda sepa. Ej: es para regalo"></textarea>
        </label>

        <p id="dcError" class="dc-error" role="alert"></p>
      </form>

      <button class="btn btn-whatsapp" id="sendWhatsapp">ENVIAR PEDIDO POR WHATSAPP</button>
      <p class="note">Se abrirá WhatsApp con tu pedido y tus datos. La próxima vez ya estarán llenos.</p>
    </div>
  </div>
  <div class="modal" id="imgModal" aria-hidden="true">
  <button class="img-close" id="imgClose" aria-label="Cerrar">✕</button>
  <div class="img-modal-content">
    <button class="img-nav prev" id="imgPrev" aria-label="Foto anterior">‹</button>
    <img id="imgBig" src="" alt="">
    <button class="img-nav next" id="imgNext" aria-label="Foto siguiente">›</button>
    <div id="imgThumbs" class="img-thumbs"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<!-- Botón flotante de WhatsApp: tienda.js le pone el número de la tienda -->
<a id="waFlotante" class="wa-flotante" href="#" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp" hidden>
  <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/></svg>
</a>




<footer class="footer" id="footer">
  <div class="footer-inner">
    <div class="footer-col">
      
      <div class="footer-social" id="footerSocial"></div>
    </div>

    <div class="footer-col">
      <h4>Contacto</h4>
      <ul class="footer-list" id="footerContacto"></ul>
    </div>

    <div class="footer-col">
      <h4>Explora</h4>
      <ul class="footer-list" id="footerCats"></ul>
    </div>
  </div>

  <div class="footer-bottom" id="footerCopy"></div>
</footer>


  <script src="tienda.js"></script>
<script src="script.js"></script>

  
</body>

</html>
