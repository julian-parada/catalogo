<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen del pedido</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pedido-wrap{max-width:600px;margin:0 auto;padding:40px 20px 80px}
    .pedido-wrap h1{font-family:"Bebas Neue";font-size:2.2rem;margin-bottom:4px}
    .pedido-fecha{color:var(--muted);font-size:.85rem;margin-bottom:30px}
    .pedido-item{display:flex;gap:16px;background:#141414;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
    .pedido-item img{width:90px;height:90px;object-fit:cover;border-radius:8px;flex-shrink:0}
    .pedido-item-body h3{margin:0 0 4px}
    .pedido-item-body p{margin:0;color:var(--muted);font-size:.88rem}
    .pedido-total{display:flex;justify-content:space-between;font-family:"Bebas Neue";font-size:1.6rem;padding-top:20px;border-top:1px solid var(--line);margin-top:10px}
    .pedido-total span:last-child{color:var(--orange)}
    .pedido-error{text-align:center;padding:80px 20px;color:var(--muted)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseConfig.js"></script>
<script src="tema.js"></script>
</head>
<body>

  <div class="pedido-wrap" id="pedidoWrap">
    <p style="color:var(--muted)">Cargando pedido...</p>
  </div>

  
  <script src="pedido.js"></script>
</body>
</html>
