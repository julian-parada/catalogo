<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control | Proveedor</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --black: #070707;
      --dark: #111111;
      --card: #171717;
      --white: #f7f7f7;
      --muted: #999999;
      --pink: #ff1493;
      --green: #25D366;
      --danger: #ff537d;
      --line: #252525;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--black); color: var(--white); padding: 20px; }
    
    /* Login */
    #loginScreen { display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: var(--card); padding: 40px; border-radius: 14px; border: 1px solid var(--line); text-align: center; max-width: 400px; width: 100%; }
    .login-box h1 { font-family: 'Bebas Neue'; font-size: 3rem; margin-bottom: 20px; letter-spacing: 0.05em; }
    .login-box input { width: 100%; padding: 15px; margin-bottom: 15px; background: var(--dark); border: 1px solid var(--line); color: white; border-radius: 8px; font-size: 1rem; }
    .login-box button { width: 100%; padding: 15px; background: var(--pink); color: white; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    .login-box button:hover { opacity: 0.8; }

    /* Dashboard */
    #dashboard { display: none; max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
    .header h1 { font-family: 'Bebas Neue'; font-size: 2.5rem; letter-spacing: 0.05em; }
    .logout-btn { background: transparent; border: 1px solid var(--line); color: var(--white); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600; }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card); border: 1px solid var(--line); padding: 20px; border-radius: 12px; }
    .stat-card h3 { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
    .stat-card .number { font-size: 2.5rem; font-weight: 900; color: var(--pink); font-family: 'Bebas Neue'; }
    .stat-card .number.green { color: var(--green); }

    /* Table */
    .table-container { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
    th, td { padding: 15px 20px; border-bottom: 1px solid var(--line); }
    th { background: var(--dark); color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    
    /* Badges */
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; display: inline-block; }
    .badge.activo { background: rgba(37, 211, 102, 0.15); color: var(--green); border: 1px solid var(--green); }
    .badge.vencido { background: rgba(255, 83, 125, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .badge.suspendido { background: rgba(153, 153, 153, 0.15); color: var(--muted); border: 1px solid var(--muted); }
    
    /* Botones de acción */
    .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-action { background: var(--white); color: var(--black); border: none; padding: 8px 12px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.8rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; }
    .btn-action:hover { background: var(--pink); color: white; }
    .btn-action.btn-suspend { background: rgba(255, 83, 125, 0.1); color: var(--danger); border: 1px solid var(--danger); }
    .btn-action.btn-suspend:hover { background: var(--danger); color: white; }

    /* Modales */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal.show { display: flex; }
    .modal-content { background: var(--card); border: 1px solid var(--line); padding: 30px; border-radius: 14px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { font-family: 'Bebas Neue'; font-size: 2rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 0.85rem; }
    .form-group input, .form-group select { width: 100%; padding: 12px; background: var(--dark); border: 1px solid var(--line); color: white; border-radius: 8px; font-size: 1rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--pink); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 900; cursor: pointer; transition: 0.2s; }
    .btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn-cancel:hover { color: white; }
    .btn-save { background: var(--green); color: var(--black); }
    .btn-save:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>Acceso Admin</h1>
      <input type="password" id="adminPass" placeholder="Contraseña" onkeypress="if(event.key === 'Enter') checkLogin()">
      <button onclick="checkLogin()">Entrar</button>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboard">
    <div class="header">
      <h1>Panel de Clientes</h1>
      <div style="display: flex; gap: 10px;">
        <button class="btn-action" style="background: var(--green); color: #000; padding: 10px 20px; font-size: 1rem;" onclick="abrirModalCliente()">➕ Nuevo Cliente</button>
        <button class="logout-btn" onclick="logout()">Salir</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Clientes</h3>
        <div class="number" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <h3>Activos</h3>
        <div class="number green" id="statActivos">0</div>
      </div>
      <div class="stat-card">
        <h3>Vencidos / Suspendidos</h3>
        <div class="number" id="statVencidos" style="color: var(--danger);">0</div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Negocio</th>
            <th>URL / ID</th>
            <th>Contacto</th>
            <th>Vencimiento</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="clientesTableBody">
          <tr><td colspan="6" style="text-align:center;">Inicia sesión para cargar los datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL PARA REGISTRAR PAGO -->
  <div class="modal" id="pagoModal">
    <div class="modal-content">
      <h2>Registrar Pago</h2>
      
      <input type="hidden" id="pagoClienteId">
      <input type="hidden" id="pagoClienteFechaVenc">
      
      <div class="form-group">
        <label>Cliente</label>
        <input type="text" id="pagoClienteNombre" disabled style="opacity: 0.6; cursor: not-allowed;">
      </div>
      <div class="form-group">
        <label>Monto a Cobrar (COP)</label>
        <input type="number" id="pagoMonto" value="200000">
      </div>
      <div class="form-group">
        <label>Método de Pago</label>
        <select id="pagoMetodo">
          <option value="Nequi">Nequi</option>
          <option value="Bancolombia">Bancolombia</option>
          <option value="Daviplata">Daviplata</option>
          <option value="Efectivo">Efectivo</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tiempo a extender</label>
        <select id="pagoPeriodo">
          <option value="1">1 Mes</option>
          <option value="2">2 Meses</option>
          <option value="3">3 Meses</option>
          <option value="6">6 Meses</option>
          <option value="12">1 Año</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-save" onclick="guardarPago()">Cobrar y Facturar</button>
      </div>
    </div>
  </div>

  <!-- MODAL PARA CREAR/EDITAR CLIENTE -->
  <div class="modal" id="clienteModal">
    <div class="modal-content">
      <h2 id="clienteModalTitle">Nuevo Cliente</h2>
      
      <!-- Campo oculto para saber si estamos editando -->
      <input type="hidden" id="editClienteId">

      <div class="form-group">
        <label>Nombre del Negocio *</label>
        <input type="text" id="newNombreNegocio" placeholder="Ej: Tienda de Ropa XYZ">
      </div>
      <div class="form-group">
        <label>Nombre del Contacto</label>
        <input type="text" id="newNombreContacto" placeholder="Ej: Juan Pérez">
      </div>
      <div class="form-group">
        <label>Teléfono / WhatsApp</label>
        <input type="text" id="newTelefono" placeholder="Ej: 3001234567">
      </div>
      <div class="form-group">
        <label>URL / ID de la Página * <small style="color:var(--muted); font-weight:400;">(Sin espacios, ej: tienda-xyz)</small></label>
        <input type="text" id="newUrlPagina" placeholder="Ej: tienda-xyz">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModalCliente()">Cancelar</button>
        <button class="btn-save" id="btnGuardarCliente" onclick="guardarCliente()" style="background: var(--pink); color: white;">Crear Cliente</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN
    // ==========================================
    const SUPABASE_URL = 'https://txnvsigmwshwduhearvz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4bnZzaWdtd3Nod2R1aGVhcnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDMzMjgsImV4cCI6MjEwNjIxOTMyOH0.JhO4JYOUTh13aZfDT4eDCioTjShcJsVjgxIXcOOS-uQ';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_PASSWORD = "admin123"; // 👈 Cámbiala por una segura

    // ==========================================
    // 2. LOGIN Y LOGOUT
    // ==========================================
    window.checkLogin = function() {
      const pass = document.getElementById('adminPass').value;
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        cargarClientes();
      } else {
        alert("Contraseña incorrecta");
      }
    };

    window.logout = function() {
      location.reload();
    };

    // ==========================================
    // 3. CARGAR Y MOSTRAR CLIENTES
    // ==========================================
    window.cargarClientes = async function() {
      const tbody = document.getElementById('clientesTableBody');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Cargando datos...</td></tr>';

      const { data: clientes, error } = await supabaseClient
        .from('clientes')
        .select('*')
        .order('fecha_vencimiento', { ascending: true });

      if (error) {
        console.error(error);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--danger);">Error al cargar datos.</td></tr>';
        return;
      }

      let activos = 0;
      let vencidos = 0;
      const hoy = new Date();
      hoy.setHours(0,0,0,0);

      tbody.innerHTML = ''; 

      clientes.forEach(cliente => {
        const fechaVenc = new Date(cliente.fecha_vencimiento + 'T00:00:00');
        const estaVencidoPorFecha = hoy > fechaVenc;
        let estadoMostrar = cliente.estado;
        
        if (estaVencidoPorFecha && cliente.estado === 'activo') estadoMostrar = 'vencido';
        
        if (estadoMostrar === 'activo') activos++; 
        else vencidos++;

        // Limpieza para evitar errores con comillas en los nombres
        const nombreSeguro = cliente.nombre_negocio.replace(/'/g, "\\'");
        const contacto = cliente.nombre_contacto ? cliente.nombre_contacto.replace(/'/g, "\\'") : '';
        const telefono = cliente.telefono || '';
        const urlSegura = cliente.url_pagina.replace(/'/g, "\\'");

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <strong>${cliente.nombre_negocio}</strong><br>
            <small style="color:var(--muted)">${cliente.nombre_contacto || 'Sin contacto'}</small>
          </td>
          <td><code style="background: var(--dark); padding: 4px 8px; border-radius: 4px;">${cliente.url_pagina}</code></td>
          <td>${cliente.telefono || '-'}</td>
          <td>${cliente.fecha_vencimiento}</td>
          <td><span class="badge ${estadoMostrar}">${estadoMostrar}</span></td>
          <td>
            <div class="action-buttons">
              <button class="btn-action" onclick="abrirModalPago('${cliente.id}', '${nombreSeguro}', '${cliente.fecha_vencimiento}')">
                💰 Cobrar
              </button>
              <button class="btn-action" style="background: rgba(255, 212, 0, 0.1); color: #ffd400; border: 1px solid #ffd400;" onclick="abrirModalEditarCliente('${cliente.id}', '${nombreSeguro}', '${contacto}', '${telefono}', '${urlSegura}')">
                ✏️ Editar
              </button>
              <button class="btn-action btn-suspend" onclick="suspenderCliente('${cliente.id}', '${nombreSeguro}')">
                🚫 Suspender
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('statTotal').textContent = clientes.length;
      document.getElementById('statActivos').textContent = activos;
      document.getElementById('statVencidos').textContent = vencidos;
    };

    // ==========================================
    // 4. CREAR Y EDITAR CLIENTE
    // ==========================================
    window.abrirModalCliente = function() {
      document.getElementById('clienteModalTitle').textContent = "Nuevo Cliente";
      document.getElementById('btnGuardarCliente').textContent = "Crear Cliente";
      document.getElementById('editClienteId').value = ""; 
      
      document.getElementById('newNombreNegocio').value = '';
      document.getElementById('newNombreContacto').value = '';
      document.getElementById('newTelefono').value = '';
      document.getElementById('newUrlPagina').value = '';
      
      document.getElementById('clienteModal').classList.add('show');
    };

    window.abrirModalEditarCliente = function(id, negocio, contacto, telefono, url) {
      document.getElementById('clienteModalTitle').textContent = "Editar Cliente";
      document.getElementById('btnGuardarCliente').textContent = "Actualizar Cliente";
      
      document.getElementById('editClienteId').value = id;
      document.getElementById('newNombreNegocio').value = negocio;
      document.getElementById('newNombreContacto').value = contacto;
      document.getElementById('newTelefono').value = telefono;
      document.getElementById('newUrlPagina').value = url;
      
      document.getElementById('clienteModal').classList.add('show');
    };

    window.cerrarModalCliente = function() {
      document.getElementById('clienteModal').classList.remove('show');
    };

    window.guardarCliente = async function() {
      const editId = document.getElementById('editClienteId').value;
      const nombre_negocio = document.getElementById('newNombreNegocio').value.trim();
      const nombre_contacto = document.getElementById('newNombreContacto').value.trim();
      const telefono = document.getElementById('newTelefono').value.trim();
      const url_pagina = document.getElementById('newUrlPagina').value.trim().toLowerCase().replace(/\s+/g, '-');
      const btn = document.getElementById('btnGuardarCliente');

      if(!nombre_negocio || !url_pagina) {
        return alert("El nombre del negocio y la URL son obligatorios.");
      }

      btn.textContent = "Guardando...";
      btn.disabled = true;

      try {
        if (editId) {
          const { error } = await supabaseClient
            .from('clientes')
            .update({ 
              nombre_negocio, 
              nombre_contacto: nombre_contacto || null, 
              telefono: telefono || null, 
              url_pagina 
            })
            .eq('id', editId);

          if (error) {
            if (error.code === '23505') throw new Error("Esa URL/ID ya está registrada por otro cliente.");
            throw error;
          }
          alert("✅ Cliente actualizado con éxito.");

        } else {
          const nuevaFecha = new Date();
          nuevaFecha.setDate(nuevaFecha.getDate() + 30);
          const fechaFormateada = nuevaFecha.toISOString().split('T')[0];

          const { error } = await supabaseClient
            .from('clientes')
            .insert([{ 
              nombre_negocio, 
              nombre_contacto: nombre_contacto || null, 
              telefono: telefono || null, 
              url_pagina, 
              fecha_vencimiento: fechaFormateada,
              estado: 'activo'
            }]);

          if (error) {
            if (error.code === '23505') throw new Error("Esa URL/ID ya está registrada. Usa otra.");
            throw error;
          }
          alert("✅ Cliente creado con éxito.");
        }

        cerrarModalCliente();
        cargarClientes();

      } catch (error) {
        console.error(error);
        alert("❌ Error: " + error.message);
      } finally {
        btn.textContent = editId ? "Actualizar Cliente" : "Crear Cliente";
        btn.disabled = false;
      }
    };

    // ==========================================
    // 5. REGISTRAR PAGOS Y FACTURAR
    // ==========================================
    window.abrirModalPago = function(id, nombre, fechaVencimiento) {
      document.getElementById('pagoClienteId').value = id;
      document.getElementById('pagoClienteNombre').value = nombre;
      document.getElementById('pagoClienteFechaVenc').value = fechaVencimiento;
      document.getElementById('pagoModal').classList.add('show');
    };

    window.cerrarModal = function() {
      document.getElementById('pagoModal').classList.remove('show');
    };

    window.guardarPago = async function() {
      const id = document.getElementById('pagoClienteId').value;
      const nombre = document.getElementById('pagoClienteNombre').value;
      const fechaActual = document.getElementById('pagoClienteFechaVenc').value;
      
      const monto = parseFloat(document.getElementById('pagoMonto').value);
      const metodo = document.getElementById('pagoMetodo').value;
      const meses = parseInt(document.getElementById('pagoPeriodo').value);
      const btn = document.querySelector('#pagoModal .btn-save');
      
      if(!monto || monto <= 0) return alert("Ingresa un monto válido.");

      btn.textContent = "Procesando...";
      btn.disabled = true;

      try {
        const hoy = new Date();
        hoy.setHours(0,0,0,0);
        let fechaBase = new Date(fechaActual + 'T00:00:00');
        
        let fechaCalculo = (fechaBase < hoy) ? hoy : fechaBase;
        fechaCalculo.setMonth(fechaCalculo.getMonth() + meses);
        
        const fechaFormateada = fechaCalculo.toISOString().split('T')[0];

        const { error: errorPago } = await supabaseClient
          .from('pagos')
          .insert([{ 
            cliente_id: id, 
            monto: monto, 
            metodo_pago: metodo, 
            mes_pagado: `Periodo de ${meses} mes(es)` 
          }]);
        if (errorPago) throw errorPago;

        const { error: errorCliente } = await supabaseClient
          .from('clientes')
          .update({ fecha_vencimiento: fechaFormateada, estado: 'activo' })
          .eq('id', id);
        if (errorCliente) throw errorCliente;

        generarFacturaTxt(nombre, monto, metodo, meses, fechaFormateada);

        alert("✅ Pago registrado, suscripción extendida y factura descargada.");
        cerrarModal();
        cargarClientes();

      } catch (error) {
        console.error(error);
        alert("❌ Hubo un error: " + error.message);
      } finally {
        btn.textContent = "Cobrar y Facturar";
        btn.disabled = false;
      }
    };

    function generarFacturaTxt(cliente, monto, metodo, meses, nuevaFecha) {
      const fechaHoy = new Date().toLocaleString('es-CO');
      const formatoMonto = monto.toLocaleString('es-CO');
      
      const texto = `
=========================================
          RECIBO DE PAGO
=========================================
Cliente:          ${cliente}
Fecha emisión:    ${fechaHoy}
Monto Pagado:     $${formatoMonto} COP
Método de Pago:   ${metodo}
Periodo Pagado:   ${meses} mes(es)
-----------------------------------------
Su suscripción ha sido extendida hasta:
${nuevaFecha}

¡Gracias por su pago!
=========================================
      `;
      
      const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Factura_${cliente.replace(/\s+/g, '_')}_${nuevaFecha}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ==========================================
    // 6. SUSPENDER CLIENTE
    // ==========================================
    window.suspenderCliente = async function(id, nombre) {
      if (!confirm(`¿Estás seguro de que quieres suspender la página de "${nombre}"?\n\nLa página web mostrará un mensaje de suspensión a sus visitantes.`)) return;

      try {
        const { error } = await supabaseClient
          .from('clientes')
          .update({ estado: 'suspendido' })
          .eq('id', id);

        if (error) throw error;
        
        alert("🚫 Cliente suspendido correctamente.");
        cargarClientes();
      } catch (error) {
        console.error(error);
        alert("❌ Error al suspender: " + error.message);
      }
    };

    // ==========================================
    // 7. CERRAR MODALES AL HACER CLIC FUERA
    // ==========================================
    window.onclick = function(event) {
      const modalPago = document.getElementById('pagoModal');
      const modalCliente = document.getElementById('clienteModal');
      if (event.target == modalPago) cerrarModal();
      if (event.target == modalCliente) cerrarModalCliente();
    };
  </script>
</body>
</html>
